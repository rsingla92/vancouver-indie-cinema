name: Ingest showtimes

# Runs once a day at 9:00 a.m. in Vancouver. GitHub schedules are UTC only, so
# both possible UTC offsets are scheduled and the job checks the local hour.
on:
  schedule:
    - cron: "0 16 * * *" # 9:00 a.m. PDT
    - cron: "0 17 * * *" # 9:00 a.m. PST
  workflow_dispatch:
    inputs:
      days:
        description: "How many days ahead to fetch"
        default: "60"
      venues:
        description: "Comma-separated venue slugs (empty = all)"
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  clock:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      SCHEDULE: ${{ github.event.schedule }}
    steps:
      - id: check
        # Decide by which cron fired and the current UTC offset, not by the wall
        # clock, so a delayed start never skips the day's run.
        run: |
          offset=$(TZ=America/Vancouver date +%z)
          case "$EVENT_NAME:$SCHEDULE:$offset" in
            schedule:"0 16 * * *":-0700|schedule:"0 17 * * *":-0800)
              echo "run=true" >> "$GITHUB_OUTPUT" ;;
            schedule:*)
              echo "Skipping: cron '$SCHEDULE' is not the 9 a.m. run for UTC offset $offset."
              echo "run=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "run=true" >> "$GITHUB_OUTPUT" ;;
          esac

  ingest:
    needs: clock
    if: needs.clock.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run ingestion
        # Inputs reach the shell through the environment, never through template expansion.
        env:
          DAYS: ${{ inputs.days || '60' }}
          VENUES: ${{ inputs.venues }}
        run: |
          set -- "--days=$DAYS"
          if [ -n "$VENUES" ]; then set -- "$@" "--venues=$VENUES"; fi
          npm run ingest -- "$@"
