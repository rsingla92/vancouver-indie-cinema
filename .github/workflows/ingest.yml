name: Ingest showtimes

# Runs three times a day in Vancouver: 9 a.m., 1 p.m. and 5 p.m. GitHub schedules
# are UTC only, so every local time is scheduled at both possible offsets and the
# first job keeps the one that lands on a local hour in LOCAL_HOURS.
on:
  schedule:
    - cron: "0 16 * * *" # 9 a.m. PDT
    - cron: "0 17 * * *" # 9 a.m. PST
    - cron: "0 20 * * *" # 1 p.m. PDT
    - cron: "0 21 * * *" # 1 p.m. PST
    - cron: "0 0 * * *"  # 5 p.m. PDT
    - cron: "0 1 * * *"  # 5 p.m. PST
  workflow_dispatch:
    inputs:
      days:
        description: "How many days ahead to fetch"
        default: "60"
      venues:
        description: "Comma-separated venue slugs (empty = all)"
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  clock:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      SCHEDULE: ${{ github.event.schedule }}
      LOCAL_HOURS: "9 13 17"
    steps:
      - id: check
        # Decide by which cron fired and the current UTC offset, not by the wall
        # clock, so a delayed start never skips a run.
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cron_hour=$(echo "$SCHEDULE" | awk '{print $2}')
          offset=$(TZ=America/Vancouver date +%z)          # -0700 or -0800
          offset_hours=$((10#${offset:1:2}))
          [ "${offset:0:1}" = "-" ] && offset_hours=$((-offset_hours))
          local_hour=$(( (cron_hour + offset_hours + 24) % 24 ))
          case " $LOCAL_HOURS " in
            *" $local_hour "*) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Skipping: cron '$SCHEDULE' is $local_hour:00 in Vancouver, not one of $LOCAL_HOURS."
               echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

  ingest:
    needs: clock
    if: needs.clock.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
    steps:
      - name: Check secrets
        # Fail in seconds with the secret's name instead of after a full extraction.
        run: |
          missing=""
          for name in DATABASE_URL TMDB_API_TOKEN; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::The $name repository secret is not set (Settings, Secrets and variables, Actions)."
              missing=1
            fi
          done
          [ -z "$missing" ]
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run ingestion
        # Inputs reach the shell through the environment, never through template expansion.
        env:
          DAYS: ${{ inputs.days || '60' }}
          VENUES: ${{ inputs.venues }}
        run: |
          set -- "--days=$DAYS"
          if [ -n "$VENUES" ]; then set -- "$@" "--venues=$VENUES"; fi
          npm run ingest -- "$@"

  # Publish whatever the run merged. Each showtime merges in its own transaction and
  # reconciliation is guarded, so the database is consistent even after a run that
  # reported errors; the red run stays visible in Actions.
  deploy:
    needs: [clock, ingest]
    if: always() && needs.clock.outputs.run == 'true' && needs.ingest.result != 'skipped'
    uses: ./.github/workflows/deploy-pages.yml
    secrets: inherit
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
